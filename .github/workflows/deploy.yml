name: Deploy Cyber Casebook

on:
  push:
    branches: ["main"]
  # Rebuild on a timer so new case studies from the Google Sheet get baked into
  # the site (home page, case pages, sitemap) without needing a push.
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (UTC)
  # Adds a "Run workflow" button on the Actions tab for an on-demand rebuild.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate site
        run: node generate.js

      - name: Upload dist folder artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
